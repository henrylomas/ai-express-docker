version: '3.9'

services:
  api:
    build: .
    container_name: ai-express-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    # opcional: para usar nodemon dentro del contenedor
    tty: true

  test:
    build: .
    container_name: ai-express-tests
    environment:
      - NODE_ENV=test
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
    # Jest se ejecuta dentro del contenedor
    command: ["npm", "test"]
